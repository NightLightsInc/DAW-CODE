<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NightLights Studio DAW</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f0f12;
      color: #f0f0f5;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .studio-wrapper {
      background: #18181f;
      border: 1px solid #2c2c38;
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 800px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #2c2c38;
      padding-bottom: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header h1 {
      margin: 0;
      font-size: 20px;
      color: #ff4b2b;
      letter-spacing: 0.5px;
    }
    .status-badge {
      background: #252530;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      color: #a0a0b5;
    }
    .transport-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
      background: #121217;
      padding: 15px;
      border-radius: 8px;
      border: 1px solid #262630;
    }
    button, .file-upload-btn {
      padding: 10px 16px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      color: #fff;
      transition: 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    #recordBtn { background-color: #e63946; }
    #recordBtn:hover:not(:disabled) { background-color: #ff4d5a; }
    #recordBtn.recording { animation: pulse 1.2s infinite; }
    #stopBtn { background-color: #4a4e69; }
    #stopBtn:hover:not(:disabled) { background-color: #5c6182; }
    #playAllBtn { background-color: #2a9d8f; }
    #playAllBtn:hover:not(:disabled) { background-color: #34b8a8; }
    #pauseAllBtn { background-color: #e9c46a; color: #121217; }
    .file-upload-btn { background-color: #3a86ff; }
    .file-upload-btn:hover { background-color: #5294ff; }
    input[type="file"] { display: none; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .tracks-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .track-row {
      background: #22222b;
      border: 1px solid #323240;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .track-info {
      min-width: 120px;
    }
    .track-name {
      font-weight: bold;
      font-size: 14px;
      display: block;
    }
    .track-type {
      font-size: 11px;
      color: #88889e;
      text-transform: uppercase;
    }
    audio {
      height: 36px;
      flex-grow: 1;
      min-width: 200px;
    }
    .track-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .download-link {
      background: #333342;
      color: #fff;
      text-decoration: none;
      padding: 6px 10px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: bold;
    }
    .download-link:hover { background: #47475c; }
    .delete-btn {
      background: #333342;
      padding: 6px 10px;
      font-size: 12px;
    }
    .delete-btn:hover { background: #e63946; }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #6c6c80;
      border: 2px dashed #2c2c38;
      border-radius: 8px;
      font-size: 14px;
    }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(230, 57, 70, 0); }
      100% { box-shadow: 0 0 0 0 rgba(230, 57, 70, 0); }
    }
  </style>
</head>
<body>

<div class="studio-wrapper">
  <div class="header">
    <h1>WEB STUDIO DAW</h1>
    <div class="status-badge" id="statusText">Ready • Upload a beat or record vocals</div>
  </div>

  <div class="transport-bar">
    <button id="recordBtn">● Record Mic</button>
    <button id="stopBtn" disabled>■ Stop</button>
    <button id="playAllBtn" disabled>▶ Play All</button>
    <button id="pauseAllBtn" disabled>❚❚ Pause All</button>
    <label class="file-upload-btn">
      + Import Beat / Audio
      <input type="file" id="beatUpload" accept="audio/*">
    </label>
  </div>

  <div class="tracks-container" id="trackList">
    <div class="empty-state" id="emptyState">
      No tracks yet. Click <strong>+ Import Beat / Audio</strong> to load an instrumental, or hit <strong>● Record Mic</strong> to start recording.
    </div>
  </div>
</div>

<script>
  let mediaRecorder;
  let audioChunks = [];
  let trackCounter = 0;

  const recordBtn = document.getElementById('recordBtn');
  const stopBtn = document.getElementById('stopBtn');
  const playAllBtn = document.getElementById('playAllBtn');
  const pauseAllBtn = document.getElementById('pauseAllBtn');
  const beatUpload = document.getElementById('beatUpload');
  const statusText = document.getElementById('statusText');
  const trackList = document.getElementById('trackList');
  const emptyState = document.getElementById('emptyState');

  function updateButtons() {
    const hasTracks = document.querySelectorAll('.track-row').length > 0;
    playAllBtn.disabled = !hasTracks;
    pauseAllBtn.disabled = !hasTracks;
    emptyState.style.display = hasTracks ? 'none' : 'block';
  }

  beatUpload.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const url = URL.createObjectURL(file);
    addTrack(url, file.name.replace(/\.[^/.]+$/, ""), "Imported Beat");
    statusText.textContent = `Loaded: ${file.name}`;
    beatUpload.value = '';
  });

  recordBtn.addEventListener('click', async () => {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        const audioUrl = URL.createObjectURL(audioBlob);
        trackCounter++;
        addTrack(audioUrl, `Vocal Take ${trackCounter}`, "Mic Recording");
        stream.getTracks().forEach(track => track.stop());
      };

      // Play existing tracks (like the beat) while recording vocals
      document.querySelectorAll('audio').forEach(audio => {
        audio.currentTime = 0;
        audio.play();
      });

      mediaRecorder.start();
      recordBtn.disabled = true;
      recordBtn.classList.add('recording');
      stopBtn.disabled = false;
      statusText.textContent = "Recording live... (Use headphones to avoid bleed)";
    } catch (err) {
      statusText.textContent = "Mic blocked! Check browser permissions or iframe allow='microphone'.";
    }
  });

  stopBtn.addEventListener('click', () => {
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
      recordBtn.disabled = false;
      recordBtn.classList.remove('recording');
      stopBtn.disabled = true;
      statusText.textContent = "Recording saved to track list.";
    }
    document.querySelectorAll('audio').forEach(audio => audio.pause());
  });

  playAllBtn.addEventListener('click', () => {
    document.querySelectorAll('audio').forEach(audio => {
      audio.currentTime = 0;
      audio.play();
    });
    statusText.textContent = "Playing all tracks...";
  });

  pauseAllBtn.addEventListener('click', () => {
    document.querySelectorAll('audio').forEach(audio => audio.pause());
    statusText.textContent = "Playback paused.";
  });

  function addTrack(url, title, type) {
    const row = document.createElement('div');
    row.className = 'track-row';

    const info = document.createElement('div');
    info.className = 'track-info';
    info.innerHTML = `<span class="track-name">${title}</span><span class="track-type">${type}</span>`;

    const audio = document.createElement('audio');
    audio.controls = true;
    audio.src = url;

    const actions = document.createElement('div');
    actions.className = 'track-actions';

    const dl = document.createElement('a');
    dl.href = url;
    dl.download = `${title}.webm`;
    dl.className = 'download-link';
    dl.textContent = 'Save';

    const delBtn = document.createElement('button');
    delBtn.className = 'delete-btn';
    delBtn.textContent = '✕';
    delBtn.title = 'Delete Track';
    delBtn.onclick = () => {
      row.remove();
      updateButtons();
    };

    actions.appendChild(dl);
    actions.appendChild(delBtn);

    row.appendChild(info);
    row.appendChild(audio);
    row.appendChild(actions);
    trackList.appendChild(row);
    updateButtons();
  }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NightLights Inc. Studio DAW</title>
<style>
  :root {
    --bg-dark: #121417;
    --bg-panel: #1b1e23;
    --bg-track: #23272e;
    --accent: #f12c18;
    --accent-blue: #2d8cff;
    --text: #e6e8eb;
    --muted: #8b949e;
    --border: #30363d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: var(--bg-dark); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }
  
  /* Transport Bar */
  header {
    height: 56px; background: var(--bg-panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between; padding: 0 20px;
  }
  .brand { font-weight: 800; font-size: 1.1rem; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
  .brand span { color: var(--accent); }
  .transport { display: flex; align-items: center; gap: 12px; }
  button {
    background: #2c313a; color: var(--text); border: 1px solid var(--border);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem; transition: 0.15s;
  }
  button:hover { background: #383e4a; }
  button.play-active { background: #1f8b4c; border-color: #2ecc71; }
  button.rec-active { background: var(--accent); border-color: #ff6b5b; animation: pulse 1.2s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.65; } 100% { opacity: 1; } }
  
  .lcd {
    background: #0d0f12; border: 1px solid var(--border); padding: 6px 14px; border-radius: 6px;
    font-family: monospace; font-size: 0.95rem; display: flex; gap: 16px; color: #58a6ff;
  }
  .lcd input {
    background: transparent; border: none; color: #58a6ff; width: 42px; font-family: monospace; font-size: 0.95rem; font-weight: bold;
  }

  /* Main Workspace */
  main { flex: 1; display: flex; overflow: hidden; }
  .sidebar { width: 250px; background: var(--bg-panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; }
  .sidebar-header { padding: 10px 14px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); text-transform: uppercase; }
  
  .track-header {
    height: 110px; padding: 12px; border-bottom: 1px solid var(--border); background: var(--bg-track);
    display: flex; flex-direction: column; justify-content: space-between;
  }
  .track-title { display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 0.9rem; }
  .track-controls { display: flex; gap: 6px; align-items: center; }
  .mini-btn { padding: 3px 7px; font-size: 0.75rem; border-radius: 4px; }
  .mini-btn.mute.active { background: #d29922; color: #000; }
  .mini-btn.solo.active { background: #2d8cff; color: #fff; }
  input[type="range"] { width: 100%; accent-color: var(--accent-blue); }

  /* Timeline & Waveforms */
  .timeline-container { flex: 1; overflow: auto; position: relative; background: #16191d; }
  .ruler { height: 37px; background: #1b1e23; border-bottom: 1px solid var(--border); position: relative; width: 2000px; }
  .playhead {
    position: absolute; top: 0; bottom: 0; width: 2px; background: var(--accent);
    pointer-events: none; z-index: 10; left: 0px;
  }
  .playhead::before {
    content: ""; position: absolute; top: 0; left: -5px; border-left: 6px solid transparent;
    border-right: 6px solid transparent; border-top: 8px solid var(--accent);
  }
  .track-lane {
    height: 110px; border-bottom: 1px solid var(--border); position: relative;
    background-image: linear-gradient(to right, #22262c 1px, transparent 1px);
    background-size: 50px 100%;
    width: 2000px;
  }
  .clip {
    position: absolute; top: 8px; height: 94px; border-radius: 6px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.2); cursor: grab;
  }
  .clip-label {
    font-size: 0.72rem; padding: 3px 8px; background: rgba(0,0,0,0.45); font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  canvas.waveform { display: block; width: 100%; height: 72px; }

  /* Sound Library & Virtual Synth */
  .bottom-dock {
    height: 150px; background: var(--bg-panel); border-top: 1px solid var(--border);
    display: flex; padding: 12px 20px; gap: 24px;
  }
  .sound-packs { width: 280px; border-right: 1px solid var(--border); padding-right: 16px; overflow-y: auto; }
  .sound-packs h4, .piano-section h4 { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; margin-bottom: 8px; }
  .sample-item {
    background: var(--bg-track); padding: 6px 10px; border-radius: 5px; margin-bottom: 6px;
    font-size: 0.82rem; display: flex; justify-content: space-between; align-items: center;
  }
  .piano-keys { display: flex; gap: 4px; height: 95px; }
  .key {
    width: 42px; background: #f0f2f5; color: #111; border-radius: 0 0 6px 6px;
    display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px;
    font-size: 0.75rem; font-weight: bold; cursor: pointer;
  }
  .key:active { background: #cfd6df; transform: translateY(2px); }
</style>
</head>
<body>

<header>
  <div class="brand"><span>●</span> NightLights Inc. Studio DAW</div>
  <div class="transport">
    <button type="button" id="btnStop">■ Stop</button>
    <button type="button" id="btnPlay">▶ Play</button>
    <button type="button" id="btnRec">● Record Mic</button>
    <div class="lcd">
      <div>BPM: <input id="bpmInput" type="number" value="120" min="60" max="200"></div>
      <div id="timeDisplay">00:00.0</div>
    </div>
  </div>
  <div>
    <button type="button" id="btnExport">⬇ Export Mix</button>
  </div>
</header>

<main>
  <div class="sidebar">
    <div class="sidebar-header">
      <span>Tracks</span>
      <button type="button" class="mini-btn" id="btnAddTrack">+ Track</button>
    </div>
    <div id="trackHeaders"></div>
  </div>

  <div class="timeline-container" id="timeline">
    <div class="ruler" id="ruler"></div>
    <div class="playhead" id="playhead"></div>
    <div id="trackLanes"></div>
  </div>
</main>

<div class="bottom-dock">
  <div class="sound-packs">
    <h4>Built-In Loops & Sound Waves</h4>
    <div class="sample-item"><span>🥁 Boom Bap Beat (2 Bars)</span><button type="button" class="mini-btn" onclick="addGeneratedClip(0, 'beat')">+ Add</button></div>
    <div class="sample-item"><span>🎸 Sub Bassline (2 Bars)</span><button type="button" class="mini-btn" onclick="addGeneratedClip(1, 'bass')">+ Add</button></div>
    <div class="sample-item"><span>🎹 Synth Chord Pad (2 Bars)</span><button type="button" class="mini-btn" onclick="addGeneratedClip(2, 'pad')">+ Add</button></div>
  </div>
  <div class="piano-section">
    <h4>Virtual Instrument (Click Keys to Play Live)</h4>
    <div class="piano-keys" id="pianoKeys"></div>
  </div>
</div>

<script>
  const AudioCtx = window.AudioContext || window.webkitAudioContext;
  const ctx = new AudioCtx();
  const PIXELS_PER_SEC = 50;

  let isPlaying = false;
  let isRecording = false;
  let startTime = 0;
  let pauseOffset = 0;
  let animFrame;
  let mediaRecorder;
  let recordedChunks = [];
  let activeSources = [];

  const tracks = [
    { id: 0, name: "Drums / Beat", color: "#f12c18", volume: 0.85, mute: false, solo: false, clips: [] },
    { id: 1, name: "Bassline", color: "#2d8cff", volume: 0.8, mute: false, solo: false, clips: [] },
    { id: 2, name: "Synth / Vocals", color: "#2ecc71", volume: 0.8, mute: false, solo: false, clips: [] }
  ];

  function renderTracks() {
    const headers = document.getElementById("trackHeaders");
    const lanes = document.getElementById("trackLanes");
    headers.innerHTML = "";
    lanes.innerHTML = "";

    tracks.forEach((t, idx) => {
      const h = document.createElement("div");
      h.className = "track-header";
      h.innerHTML = `
        <div class="track-title">
          <span style="color:${t.color}">■ ${t.name}</span>
          <div class="track-controls">
            <button type="button" class="mini-btn mute ${t.mute ? 'active' : ''}" onclick="toggleMute(${idx})">M</button>
            <button type="button" class="mini-btn solo ${t.solo ? 'active' : ''}" onclick="toggleSolo(${idx})">S</button>
          </div>
        </div>
        <input type="range" min="0" max="1" step="0.01" value="${t.volume}" oninput="setVolume(${idx}, this.value)">
      `;
      headers.appendChild(h);

      const lane = document.createElement("div");
      lane.className = "track-lane";

      t.clips.forEach(clip => {
        const el = document.createElement("div");
        el.className = "clip";
        el.style.left = (clip.start * PIXELS_PER_SEC) + "px";
        el.style.width = (clip.buffer.duration * PIXELS_PER_SEC) + "px";
        el.style.background = t.color + "33";
        el.style.borderColor = t.color;

        const label = document.createElement("div");
        label.className = "clip-label";
        label.textContent = clip.name;
        el.appendChild(label);

        const canvas = document.createElement("canvas");
        canvas.className = "waveform";
        canvas.width = Math.max(10, Math.floor(clip.buffer.duration * PIXELS_PER_SEC));
        canvas.height = 72;
        drawWaveform(canvas, clip.buffer, t.color);
        el.appendChild(canvas);

        makeDraggable(el, clip);
        lane.appendChild(el);
      });
      lanes.appendChild(lane);
    });
  }

  function drawWaveform(canvas, buffer, color) {
    const c = canvas.getContext("2d");
    const data = buffer.getChannelData(0);
    const step = Math.max(1, Math.ceil(data.length / canvas.width));
    const amp = canvas.height / 2;
    c.fillStyle = color;

    for (let i = 0; i < canvas.width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const val = data[(i * step) + j];
if (val !== undefined) {
if (val < min) min = val;
if (val > max) max = val;
}
}
c.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
}
}
function createLoopBuffer(type) {
const bpm = Number(document.getElementById("bpmInput").value) || 120;
const duration = (60 / bpm) * 8;
const sampleRate = ctx.sampleRate;
const buffer = ctx.createBuffer(1, Math.floor(sampleRate * duration), sampleRate);
const data = buffer.getChannelData(0);
const beatLen = sampleRate * (60 / bpm);
for (let i = 0; i < data.length; i++) {
const t = i / sampleRate;
const beatPos = i % beatLen;
const beatIndex = Math.floor(i / beatLen);
if (type === "beat") {
let sample = 0;
if (beatIndex % 2 === 0 && beatPos < sampleRate * 0.25) {
const env = Math.exp(-beatPos / (sampleRate * 0.06));
sample += Math.sin(2 * Math.PI * (120 * env + 40) * (beatPos / sampleRate)) * env;
}
if (beatIndex % 2 === 1 && beatPos < sampleRate * 0.2) {
const env = Math.exp(-beatPos / (sampleRate * 0.05));
sample += (Math.random() * 2 - 1) * env * 0.8;
}
if ((i % (beatLen / 2)) < sampleRate * 0.04) {
sample += (Math.random() * 2 - 1) * 0.25;
}
data[i] = Math.max(-1, Math.min(1, sample));
} else if (type === "bass") {
const notes = [55, 55, 65.41, 73.42, 55, 55, 82.41, 73.42];
const freq = notes[beatIndex % notes.length];
const env = Math.exp(-beatPos / (beatLen * 0.7));
data[i] = Math.tanh(Math.sin(2 * Math.PI * freq * t) * 2.5) * env * 0.6;
} else if (type === "pad") {
const chord = [220, 261.63, 329.63, 392.00];
let sum = 0;
chord.forEach(f => sum += Math.sin(2 * Math.PI * f * t));
data[i] = (sum / chord.length) * 0.45 * Math.sin((Math.PI * i) / data.length);
}
}
return buffer;
}
function addGeneratedClip(trackIdx, type) {
if (ctx.state === "suspended") ctx.resume();
const targetTrack = tracks[trackIdx] || tracks[0];
const lastEnd = targetTrack.clips.reduce((max, c) => Math.max(max, c.start + c.buffer.duration), 0);
const buffer = createLoopBuffer(type);
targetTrack.clips.push({ name: type.toUpperCase() + " Loop", start: lastEnd, buffer });
renderTracks();
}
function makeDraggable(el, clip) {
let startX, origStart;
el.onmousedown = (e) => {
startX = e.clientX;
origStart = clip.start;
window.onmousemove = (ev) => {
const dx = (ev.clientX - startX) / PIXELS_PER_SEC;
clip.start = Math.max(0, origStart + dx);
el.style.left = (clip.start * PIXELS_PER_SEC) + "px";
};
window.onmouseup = () => { window.onmousemove = null; };
};
}
function startPlayback() {
if (isPlaying) return;
if (ctx.state === "suspended") ctx.resume();
isPlaying = true;
document.getElementById("btnPlay").classList.add("play-active");
startTime = ctx.currentTime - pauseOffset;
const anySolo = tracks.some(t => t.solo);
tracks.forEach(t => {
if (t.mute || (anySolo && !t.solo)) return;
const gain = ctx.createGain();
gain.gain.value = t.volume;
gain.connect(ctx.destination);
t.clips.forEach(clip => {
const clipEnd = clip.start + clip.buffer.duration;
if (clipEnd > pauseOffset) {
const src = ctx.createBufferSource();
src.buffer = clip.buffer;
src.connect(gain);
const delay = Math.max(0, clip.start - pauseOffset);
const offset = Math.max(0, pauseOffset - clip.start);
src.start(ctx.currentTime + delay, offset);
activeSources.push(src);
}
});
});
updatePlayhead();
}
function stopPlayback() {
isPlaying = false;
document.getElementById("btnPlay").classList.remove("play-active");
activeSources.forEach(s => { try { s.stop(); } catch(e){} });
activeSources = [];
cancelAnimationFrame(animFrame);
pauseOffset = 0;
document.getElementById("playhead").style.left = "0px";
document.getElementById("timeDisplay").textContent = "00:00.0";
}
function updatePlayhead() {
if (!isPlaying) return;
const elapsed = ctx.currentTime - startTime;
pauseOffset = elapsed;
document.getElementById("playhead").style.left = (elapsed * PIXELS_PER_SEC) + "px";
const mins = String(Math.floor(elapsed / 60)).padStart(2, "0");
const secs = (elapsed % 60).toFixed(1).padStart(4, "0");
document.getElementById("timeDisplay").textContent = ${mins}:${secs};
animFrame = requestAnimationFrame(updatePlayhead);
}
document.getElementById("btnRec").onclick = async () => {
const btn = document.getElementById("btnRec");
if (!isRecording) {
try {
if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
alert("Microphone recording requires HTTPS or localhost.");
return;
}
const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
mediaRecorder = new MediaRecorder(stream);
recordedChunks = [];
const recStartPos = pauseOffset;
mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
mediaRecorder.onstop = async () => {
const blob = new Blob(recordedChunks, { type: "audio/webm" });
const arrayBuf = await blob.arrayBuffer();
const audioBuf = await ctx.decodeAudioData(arrayBuf);
tracks[2].clips.push({ name: "Mic Recording", start: recStartPos, buffer: audioBuf });
renderTracks();
stream.getTracks().forEach(track => track.stop());
};
mediaRecorder.start();
isRecording = true;
btn.classList.add("rec-active");
btn.textContent = "■ Stop Rec";
if (!isPlaying) startPlayback();
} catch (err) {
alert("Could not access microphone: " + err.message);
}
} else {
mediaRecorder.stop();
isRecording = false;
btn.classList.remove("rec-active");
btn.textContent = "● Record Mic";
stopPlayback();
}
};
const notes = [
{ name: "C4", freq: 261.63 }, { name: "D4", freq: 293.66 }, { name: "E4", freq: 329.63 },
{ name: "F4", freq: 349.23 }, { name: "G4", freq: 392.00 }, { name: "A4", freq: 440.00 },
{ name: "B4", freq: 493.88 }, { name: "C5", freq: 523.25 }
];
const pianoDiv = document.getElementById("pianoKeys");
notes.forEach(n => {
const k = document.createElement("div");
k.className = "key";
k.textContent = n.name;
k.onmousedown = () => {
if (ctx.state === "suspended") ctx.resume();
const osc = ctx.createOscillator();
const g = ctx.createGain();
osc.type = "triangle";
osc.frequency.value = n.freq;
g.gain.setValueAtTime(0.3, ctx.currentTime);
g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.6);
osc.connect(g).connect(ctx.destination);
osc.start();
osc.stop(ctx.currentTime + 0.6);
};
pianoDiv.appendChild(k);
});
function toggleMute(i) { tracks[i].mute = !tracks[i].mute; renderTracks(); }
function toggleSolo(i) { tracks[i].solo = !tracks[i].solo; renderTracks(); }
function setVolume(i, v) { tracks[i].volume = Number(v); }
document.getElementById("btnPlay").onclick = startPlayback;
document.getElementById("btnStop").onclick = stopPlayback;
document.getElementById("btnAddTrack").onclick = () => {
const colors = ["#e67e22", "#9b59b6", "#1abc9c", "#e84393"];
tracks.push({
id: tracks.length,
name: Audio Track ${tracks.length + 1},
color: colors[tracks.length % colors.length],
volume: 0.8, mute: false, solo: false, clips: []
});
renderTracks();
};
document.getElementById("btnExport").onclick = async () => {
const totalSec = tracks.reduce((max, t) =>
Math.max(max, t.clips.reduce((m, c) => Math.max(m, c.start + c.buffer.duration), 0)), 1);
const offline = new OfflineAudioContext(1, Math.ceil(totalSec * ctx.sampleRate), ctx.sampleRate);
tracks.forEach(t => {
if (t.mute) return;
const g = offline.createGain();
g.gain.value = t.volume;
g.connect(offline.destination);
t.clips.forEach(c => {
const s = offline.createBufferSource();
s.buffer = c.buffer;
s.connect(g);
s.start(c.start);
});
});
const rendered = await offline.startRendering();
const wavBlob = bufferToWav(rendered);
const url = URL.createObjectURL(wavBlob);
const a = document.createElement("a");
a.href = url; a.download = "nightlights-studio-mix.wav"; a.click();
};
function bufferToWav(abuffer) {
const numOfChan = abuffer.numberOfChannels, length = abuffer.length * numOfChan * 2 + 44;
const buffer = new ArrayBuffer(length), view = new DataView(buffer);
let pos = 0;
const setUint16 = d => { view.setUint16(pos, d, true); pos += 2; };
const setUint32 = d => { view.setUint32(pos, d, true); pos += 4; };
setUint32(0x46464952); setUint32(length - 8); setUint32(0x45564157);
setUint32(0x20746d66); setUint32(16); setUint16(1); setUint16(numOfChan);
setUint32(abuffer.sampleRate); setUint32(abuffer.sampleRate * 2 * numOfChan);
setUint16(numOfChan * 2); setUint16(16); setUint32(0x61746164); setUint32(length - pos - 4);
const ch = abuffer.getChannelData(0);
for (let i = 0; i < ch.length; i++) {
const s = Math.max(-1, Math.min(1, ch[i]));
view.setInt16(pos, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
pos += 2;
}
return new Blob([buffer], { type: "audio/wav" });
}
addGeneratedClip(0, "beat");
addGeneratedClip(1, "bass");

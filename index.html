<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NightLights Inc. Studio DAW</title>
<style>
:root{color-scheme:dark;--ink:#0d0716;--panel:#1a1027;--well:#120a1e;--line:#2e1f47;--beat:#4a2f73;--text:#f1e9ff;--dim:#9b8bb8;--lamp:#b26bff;--glow:#e05cff;--cyan:#d6a6ff;--red:#c2453f;--HDR:172px;--r:10px;--shadow:0 10px 30px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ink);color:var(--text);font:14px/1.4 Peignot,"Segoe UI",ui-sans-serif,system-ui,-apple-system,sans-serif;display:grid;grid-template-columns:var(--sideW,280px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
header{position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1f1338,#140c24);box-shadow:0 1px 0 rgba(178,107,255,.08);grid-column:2;grid-row:1}
.brand h1{margin:0;font:600 22px/1.1 Peignot,"Segoe UI",ui-sans-serif,system-ui,sans-serif;letter-spacing:.3px;color:#fff}
.brand p{margin:3px 0 0;color:var(--dim);font-size:12px}
.transport{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap}
button,.btn{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer;display:inline-block;transition:background .15s,border-color .15s,transform .05s}
button:active,.btn:active{transform:translateY(1px)}
button:hover,.btn:hover{border-color:var(--lamp);background:#241735}
button:focus-visible,input:focus-visible,.btn:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
#play{background:var(--lamp);color:#1a0b2e;border-color:transparent;font-weight:600;min-width:84px}
#play[aria-pressed="true"]{background:var(--glow)}
#rec{min-width:96px}
#rec[aria-pressed="true"]{background:var(--red);color:#fff;border-color:transparent}
#export[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp)}
#clock{font-variant-numeric:tabular-nums;font-size:16px;min-width:170px;padding:6px 12px;border-radius:999px;background:var(--well);border:1px solid var(--line);color:var(--cyan)}
.ctl{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12px}
.ctl output{font-variant-numeric:tabular-nums;color:var(--text);min-width:3ch}
.ctl input{width:90px;accent-color:var(--lamp)}
input[type=file]{display:none}
.arr{flex:1;overflow:auto;position:relative;min-height:300px;background:var(--well);border-bottom:1px solid var(--line)}
.inner{position:relative}
.row{display:flex;align-items:stretch}
.hdr{flex:none;width:var(--HDR);position:sticky;left:0;z-index:2;background:var(--panel)}
.ruler{position:sticky;top:0;z-index:3}
.ruler .hdr{height:26px;border-bottom:1px solid var(--line)}
.ruler .body{height:26px;background:var(--panel);border-bottom:1px solid var(--line)}
.tick{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);padding-left:4px;color:var(--dim);font-size:11px;line-height:26px}
.body{position:relative;flex:none;height:116px;border-bottom:1px solid var(--line);background:repeating-linear-gradient(90deg,transparent 0 calc(var(--bw,80px) - 1px),var(--line) calc(var(--bw,80px) - 1px) var(--bw,80px))}
.lane .hdr{height:116px;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:8px 10px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);cursor:pointer}
.lane.sel .hdr{background:#2a1a44}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbtns{display:flex;gap:6px}
.hbtns button{padding:2px 9px;font-size:12px}
.hbtns button[aria-pressed="true"][data-act="mute"]{color:var(--lamp);border-color:var(--lamp)}
.hbtns button[aria-pressed="true"][data-act="solo"]{color:var(--cyan);border-color:var(--cyan)}
.hdr input[type=range]{width:100%;accent-color:var(--lamp)}
.clip{position:absolute;top:6px;bottom:6px;border-radius:8px;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(0,0,0,.25));border:1px solid var(--tc,#6b4d22);overflow:hidden;cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,.35)}
.clip.live{border-color:var(--red);background:#2a1816}
.clip canvas{display:block;height:100%}
.clip.sel{box-shadow:inset 0 0 0 2px #fff}
.clipdel{position:absolute;top:2px;right:2px;z-index:2;padding:0 6px;font-size:12px;line-height:16px;background:rgba(0,0,0,.6)}
.takes{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;gap:4px}
.synthEd{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#1d1330,var(--panel));box-shadow:var(--shadow)}
.synthEd[hidden]{display:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.pc{display:flex;flex-direction:column;font-size:12px;color:var(--dim);gap:4px}
.pc input,.pc select,.synthEd select{accent-color:var(--lamp);font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:3px 6px}
.keys{display:flex;gap:4px;margin-top:12px;flex-wrap:wrap}
.keys button{padding:6px 0;width:44px}
.keys button.in{background:var(--lamp);color:#1a0b2e;border-color:transparent}
.keys button.root{outline:2px solid var(--cyan);outline-offset:2px}
.roll{margin:14px 0;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(180deg,#1d1330,var(--panel));box-shadow:var(--shadow)}
.roll[hidden]{display:none}
.rollWrap{overflow:auto;max-height:520px;margin-top:10px;border:1px solid var(--line);border-radius:8px}
#roll,#rollVel,#rollBend{display:block}
#roll{cursor:crosshair}
#rollVel,#rollBend{cursor:ns-resize;border-top:1px solid var(--line)}
.roll .dim{color:var(--dim);font-size:12px;margin-left:10px}
.clip .cl{position:absolute;left:6px;top:4px;font-size:11px;color:#fff;background:rgba(0,0,0,.5);padding:1px 6px;border-radius:4px;pointer-events:none;z-index:1}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);z-index:4;pointer-events:none}
section.beat{padding:18px 22px 28px}
section.beat h2{margin:0 0 12px;font-size:15px;font-weight:600;letter-spacing:.2px}
section.beat h2 small{color:var(--dim);font-weight:400;font-size:12px;margin-left:8px}
.rackWrap{overflow-x:auto;padding-bottom:6px}
.brow{min-width:820px;display:grid;grid-template-columns:300px 130px repeat(16,1fr);gap:4px;align-items:center;margin-bottom:4px;padding:3px 0;border-bottom:1px solid rgba(46,31,71,.5)}
.bname{display:flex;align-items:center;gap:5px;min-width:0}
.bname span{min-width:52px}
.bl{display:flex;flex-direction:column;min-width:0;width:74px}
.bl small{color:var(--dim);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kitbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--well)}
.kitbar select{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
#kitMsg{color:var(--lamp);font-size:12px}
.kitbar button,.kitbar .btn{padding:5px 10px;font-size:12px}
.kitbar select{padding:5px 8px;font-size:12px}
.bname button{padding:3px 9px;font-size:12px}
.bname button[aria-pressed="true"]{color:var(--lamp);border-color:var(--lamp)}
.brow.muted .step.on{opacity:.3}
.brow input[type=range]{width:100%;accent-color:var(--lamp)}
.tune{display:flex;flex-direction:column;gap:3px}
.tune input{height:14px;margin:0}
.bname button{padding:2px 6px;font-size:11px;border-radius:6px}
.grip{cursor:grab;color:var(--dim);padding:0 2px;user-select:none;font-size:14px}
.pos{width:46px;font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:2px 4px}
.step{height:30px;border-radius:7px;background:#160d24;border:1px solid var(--line);padding:0;cursor:pointer;transition:background .1s,transform .05s}
.step:hover{border-color:var(--dim)}
.step.beat{border-color:#3a2660}
.step.on{background:linear-gradient(180deg,#c48cff,var(--lamp));border-color:var(--lamp);box-shadow:0 0 10px rgba(178,107,255,.35)}
.step.now{outline:1px solid var(--cyan);outline-offset:1px}
.bar{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
footer{padding:10px 20px 20px;color:var(--dim);font-size:12px;border-top:1px solid var(--line)}
kbd{border:1px solid var(--line);border-radius:4px;padding:0 5px;font:inherit;color:var(--text)}
.filetools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;order:99;margin-left:8px;position:relative}
.eqc{width:220px;height:130px;border-radius:8px;border:1px solid var(--line);cursor:grab;touch-action:none;display:block}
.exportMenu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;display:flex;gap:6px;padding:10px;border-radius:var(--r);background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow)}
.exportMenu[hidden]{display:none}
.numbox{width:58px;font:inherit;font-size:12px;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:2px 4px;margin-left:6px}
.sidegrip{position:absolute;top:0;right:-3px;width:6px;height:100%;cursor:col-resize;z-index:5}
.presetRow{display:flex;flex-direction:column;gap:6px}
.presetRow select{font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
@media (max-width:760px){
  body{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:auto auto minmax(0,1fr) !important}
  header{grid-column:1 !important;grid-row:1 !important}
  .side{grid-column:1 !important;grid-row:2 !important;height:auto !important;min-height:0;width:auto !important;border-right:none;border-bottom:1px solid var(--line);padding:8px 10px;overflow:visible}
  main{grid-column:1 !important;grid-row:3 !important}
  .sidegrip,#sideToggle{display:none !important}
  .side .folder{margin:0 0 6px;padding:6px 10px}
  .side:not(.expanded) .folder[open] > *:not(summary){display:none}
  .side.expanded{position:fixed !important;inset:0;width:100vw !important;height:100vh !important;z-index:70;overflow-y:auto;padding:14px;background:var(--ink)}
  .side.expanded details:not([open]){display:none}
}
.side.expanded{position:fixed !important;inset:0;width:100vw !important;height:100vh;max-width:none;z-index:70;padding:18px 22px;border:none;background:var(--ink);box-shadow:none}
.side.expanded .sidegrip{display:none}
.side.expanded details:not([open]){display:none}
.side.expanded details[open]{min-height:100%;border:none;background:none}
.folderbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.folderbar[hidden]{display:none}
.fbtn{font-weight:600;padding:6px 14px;border-radius:999px}
.fbtn[aria-pressed="true"]{border-color:var(--lamp);color:var(--lamp);background:#241735}
.folderbar #sideToggle{margin-left:auto}
body{grid-template-columns:minmax(0,1fr) !important;grid-template-rows:auto auto minmax(0,1fr) !important}
header,#folderBar,main{grid-column:1 !important}
header{grid-row:1 !important}
#folderBar{grid-row:2 !important}
main{grid-row:3 !important}
.side:not(.expanded){display:none !important}
.sidegrip{display:none !important}
.shell{display:contents}
.side{position:relative;grid-column:1;grid-row:1 / span 2;min-height:0;height:100%;border-right:1px solid var(--line);padding:14px;overflow-y:auto;background:linear-gradient(180deg,#170e28,#110a1d)}
.side.collapsed{display:none}
body:has(.side.collapsed){grid-template-columns:minmax(0,1fr)}
body:has(.side.collapsed) header,body:has(.side.collapsed) main{grid-column:1}
.folder{margin-bottom:12px;border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;background:rgba(255,255,255,.02)}
.folder summary{cursor:pointer;font-weight:600;padding:4px 0;list-style:none;display:flex;justify-content:space-between;align-items:center;color:#fff}
.folder summary::-webkit-details-marker{display:none}
.folder summary::after{content:"\25BE";color:var(--dim)}
.folder:not([open]) summary::after{content:"\25B8"}
.fitems{display:flex;flex-direction:column;gap:6px;margin-top:8px;font-size:13px;color:var(--dim)}
main{grid-column:2;grid-row:2;min-width:0;min-height:0;overflow:auto;display:flex;flex-direction:column}
.mixer{display:flex;gap:8px;overflow-x:auto;padding:8px 0}
.strip{display:flex;flex-direction:column;align-items:center;gap:6px;width:68px;flex:none;overflow:hidden;padding:10px 6px;border-radius:var(--r);background:var(--well);border:1px solid var(--line)}
.fader{writing-mode:vertical-lr;direction:rtl;width:22px;height:140px;margin:0;accent-color:var(--lamp)}
.snm{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;width:60px;text-align:center}
.sbtns{display:flex;gap:3px}
.sbtns button{padding:2px 0;font-size:10px;width:20px;min-width:0}
.strip>input[type=range]:not(.fader){width:54px;margin:0}
.fxBox{margin-top:10px;display:flex;flex-direction:column;gap:8px}
.fxhead{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.fxhead select{font:inherit;color:var(--text);background:var(--well);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%}
.fxcard{border:1px solid var(--line);border-radius:8px;padding:8px;background:var(--well);display:flex;flex-direction:column;gap:6px}
.fxtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fxtop button{padding:2px 6px;font-size:11px}
.fxp{display:flex;flex-direction:column;font-size:11px;color:var(--dim);gap:2px}
.fxp input{accent-color:var(--lamp);width:100%}
.fxempty{color:var(--dim);font-size:12px;margin:4px 0}
</style>
</head>
<body>
<header>
  <div class="filetools">
    <label class="btn" for="file">Import audio</label><input id="file" type="file" accept="audio/*">
    <button id="export" aria-pressed="false">Export mix</button>
    <div id="exportMenu" class="exportMenu" hidden><button data-fmt="wav">WAV</button><button data-fmt="mp3">MP3</button><button data-fmt="mp4">MP4</button></div>
    <button id="saveTrack">Save track</button>
  </div>
  <div class="brand">
    <h1>NightLights Inc. Studio DAW</h1>
    <p>Multitrack studio. Record, import, and arrange.</p>
  </div>
  <div class="transport">
    <button id="sideToggle" aria-expanded="true">Hide folders</button>
    <button id="play" aria-pressed="false">Play</button>
    <button id="stop">Stop</button>
    <button id="metro" aria-pressed="false">Metronome</button>
    <button id="latency">Latency test</button>
    <button id="rec" aria-pressed="false">Record</button>
    <output id="clock">0:00.0</output>
    <label class="ctl">Tempo <input id="bpm" type="range" min="60" max="180" value="96"><output id="bpmOut">96</output></label>
    <label class="ctl">Zoom <input id="zoom" type="range" min="20" max="220" value="80"></label>
    <label class="ctl">Master <input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
    <label class="ctl"><input id="snap" type="checkbox" checked> Snap to beat</label>
    <button id="addTrack">Add track</button>
  </div>
</header>

<div class="shell">
<aside class="side" id="side">
  <details class="folder" open>
    <summary>Beat making</summary>
    <div class="fitems">
      <label><input type="checkbox" data-show="kit" checked> Kits and channel rack</label>
      <label><input type="checkbox" data-show="synth" checked> Synth editor</label>
      <label><input type="checkbox" data-show="roll" checked> Piano roll</label>
    </div>
  </details>
  <details class="folder" open>
    <summary>Mixing</summary>
    <div id="mixer" class="mixer"></div>
    <div id="fxBox" class="fxBox"></div>
  </details>
  <details class="folder" open id="fPresets">
    <summary>Presets</summary>
    <div id="presetBox" class="fitems"></div>
  </details>
  <div id="sideGrip" class="sidegrip" title="Drag to resize"></div>
</aside>
<main>
  <div class="arr" id="arr">
    <div class="inner" id="inner">
      <div class="row ruler"><div class="hdr"></div><div class="body" id="rulerBody"></div></div>
      <div id="lanes"></div>
      <div class="ph" id="ph"></div>
    </div>
  </div>

  <section class="beat">
    <h2>Beat <small>Loops every bar and stays locked to the transport.</small></h2>
    <div class="kitbar" id="kitbar">
      <label class="ctl">Kit <select id="kitSel"></select></label>
      <button id="newKit">New kit</button>
      <button id="renameKit">Rename kit</button>
      <label class="btn" for="kitFiles">Load samples</label>
      <select id="instSel" aria-label="Instrument"></select>
      <button id="addInst">Add instrument</button>
      <select id="drumSel" aria-label="Drum"></select>
      <button id="addDrum">Add drum</button>
      <button id="addChannel">Add channel</button>
      <button id="saveKit">Save kit</button>
      <label class="btn" for="kitFolder">Add kit from computer</label>
      <label class="btn" for="presetJson">Import preset</label>
      <label class="btn" for="kitJson">Open kit</label>
      <span id="kitMsg"></span>
    </div>
    <div id="beat"></div>
    <div id="synthEd" class="synthEd" hidden></div>
    <section id="rollSec" class="roll" hidden>
      <div class="bname"><strong id="rollName">Piano roll</strong><span class="dim">Click to add or remove notes. Drag a note's right edge to change its length.</span></div>
      <div class="rollWrap"><canvas id="roll"></canvas><canvas id="rollVel"></canvas><canvas id="rollBend"></canvas></div>
    </section>
    <input id="kitFiles" type="file" accept="audio/*" multiple hidden>
    <input id="voiceFile" type="file" accept="audio/*" hidden>
    <input id="kitJson" type="file" accept=".json,application/json" hidden>
    <input id="kitFolder" type="file" accept="audio/*" webkitdirectory multiple hidden>
    <input id="presetJson" type="file" accept=".json,application/json" hidden>
    <div class="bar">
      <button id="clear">Clear beat</button>
      <button id="demo">Load night drive</button>
      <button id="saveTake">Save beat take</button>
      <span id="takes" class="takes"></span>
    </div>
  </section>
</main>
</div>


<script>
const $ = id => document.getElementById(id);
const HDR = 172;
let px = 80, bpm = 96, sel = 0;

const VOICES = [
  {name:'Kick',  kind:'kick',  vol:.9,         pat:'x...x...x...x...'},
  {name:'Snare', kind:'snare', vol:.7,         pat:'....x.......x...'},
  {name:'Clap',  kind:'clap',  vol:.45,        pat:'.......x........'},
  {name:'Hat',   kind:'hat',   vol:.4,         pat:'..x...x...x...x.'},
  {name:'Bass',  kind:'bass',  vol:.6, f:55,   pat:'x..x..x.x..x..x.'},
  {name:'Pluck', kind:'pluck', vol:.35, f:220, pat:'....x.......x...'}
];
const DEFAULT = VOICES.map(v => [...v.pat].map(c => c === 'x'));
let grid = DEFAULT.map(r => [...r]);
const bmuted = VOICES.map(() => false);
const bvol = VOICES.map(v => v.vol);

const COLORS = ['#b26bff', '#e05cff', '#d6a6ff', '#8f5bff', '#ff7ad9', '#c79bff'];
let colorIdx = 0;
const mkTrack = name => ({ name, color: COLORS[colorIdx++ % COLORS.length], vol: .8, mute: false, solo: false, clips: [] });
let tracks = [mkTrack('Vocal'), mkTrack('Guitar')];
const uid = () => Math.random().toString(36).slice(2, 9);

let ctx = null, master = null, recDest = null, noiseBuf = null, micStream = null;
let playing = false, pos = 0, pos0 = 0, t0 = 0, srcs = [], timer = null, nextBeat = 0, beatK = 0, rafOn = false;
let rec = null, recTimer = null, mixRec = null;

const barSec = () => 240 / bpm;
const sd = () => 60 / bpm / 4;
const clipsEnd = () => tracks.reduce((e, t) => t.clips.reduce((m, c) => Math.max(m, c.start + c.dur), e), 0);
const timelineLen = () => Math.max(60, Math.ceil(Math.max(clipsEnd(), pos) + 30));
const curPos = () => playing ? pos0 + Math.max(0, ctx.currentTime - t0) : pos;
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(1).padStart(4, '0')}`;

// ---------- Audio engine ----------
function init() {
  if (!ctx) {
    ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
    master = ctx.createGain();
    master.gain.value = +$('master').value;
    master.connect(ctx.destination);
    recDest = ctx.createMediaStreamDestination();
    master.connect(recDest);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 0.5, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  }
  if (ctx.state === 'suspended') ctx.resume();
}

function env(g, t, peak, dur) {
  g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
}
function noise(out, t, dur, type, freq, q, peak) {

  $('rollName').textContent = c.name + ' piano roll';

function saveTrack() {

  if (!tr.clips.length) { kitMsg('This track has no clips to save'); return; }
  const end = clipsEnd();

  tracks.forEach(t => { t.solo = t === tr; });
  play(0);
  const dest = ctx.createMediaStreamDestination();

  const r = new MediaRecorder(dest.stream, type ? { mimeType: type } : undefined);

    render();

let metroOn = false, exportFmt = 'wav';
function metroClick(t, bar) {

  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = bar ? 1500 : 1000;

async function latencyTest() {
  init();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
  catch (err) { kitMsg('Allow microphone access to run the latency test'); return; }
  const an = ctx.createAnalyser(); an.fftSize = 2048;
  ctx.createMediaStreamSource(stream).connect(an);
  const buf = new Float32Array(an.fftSize), t0 = ctx.currentTime + 0.3;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.frequency.value = 1000;
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(0.9, t0 + 0.002); g.gain.linearRampToValueAtTime(0, t0 + 0.02);
  o.connect(g); g.connect(ctx.destination); o.start(t0); o.stop(t0 + 0.03);
  kitMsg('Listening for the test click...');
  const deadline = performance.now() + 2500; let heard = null;
  while (performance.now() < deadline && heard === null) {
    await new Promise(r => requestAnimationFrame(r));
    if (ctx.currentTime < t0) continue;
    an.getFloatTimeDomainData(buf);
    let pk = 0; for (let i = 0; i < buf.length; i++) pk = Math.max(pk, Math.abs(buf[i]));
    if (pk > 0.05) heard = ctx.currentTime;
  }
  stream.getTracks().forEach(t => t.stop());
  if (heard !== null) latencySec = heard - t0;
  if (heard === null) kitMsg('No test click heard. Turn up your speakers and try again');
  else kitMsg(`Round trip about ${Math.round((heard - t0) * 1000)} ms, output latency ${Math.round((ctx.outputLatency || ctx.baseLatency || 0) * 1000)} ms`);
}
$('latency').addEventListener('click', latencyTest);

function nameFor(ext) { return `nightlights-mix-${new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-')}.${ext}`; }
function encodeWavStereo(buf) {
  const chs = Math.min(2, buf.numberOfChannels), L = buf.getChannelData(0), R = buf.numberOfChannels > 1 ? buf.getChannelData(1) : L;
  const len = buf.length, sr = buf.sampleRate, ab = new ArrayBuffer(44 + len * chs * 2), v = new DataView(ab);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, 36 + len * chs * 2, true); str(8, 'WAVE'); str(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, chs, true); v.setUint32(24, sr, true);
  v.setUint32(28, sr * chs * 2, true); v.setUint16(32, chs * 2, true); v.setUint16(34, 16, true);
  str(36, 'data'); v.setUint32(40, len * chs * 2, true);
  let o = 44;
  for (let i = 0; i < len; i++) for (let c = 0; c < chs; c++) {
    const x = Math.max(-1, Math.min(1, c ? R[i] : L[i]));
    v.setInt16(o, x < 0 ? x * 0x8000 : x * 0x7fff, true); o += 2;
  }
  return new Uint8Array(ab);
}
function toI16(f) {
  const out = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++) { const x = Math.max(-1, Math.min(1, f[i])); out[i] = x < 0 ? x * 0x8000 : x * 0x7fff; }
  return out;
}
function loadLame() {
  return new Promise((res, rej) => {
    if (window.lamejs) return res();
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js';
    s.onload = () => res(); s.onerror = () => rej(new Error('the MP3 encoder could not load'));
    document.head.append(s);
  });
}
function encodeMp3(buf) {
  const chs = Math.min(2, buf.numberOfChannels), enc = new lamejs.Mp3Encoder(chs, buf.sampleRate, 192);
  const L = toI16(buf.getChannelData(0)), R = chs > 1 ? toI16(buf.getChannelData(1)) : null, out = [];
  for (let i = 0; i < L.length; i += 1152) {
    const d = chs > 1 ? enc.encodeBuffer(L.subarray(i, i + 1152), R.subarray(i, i + 1152)) : enc.encodeBuffer(L.subarray(i, i + 1152));
    if (d.length) out.push(d);
  }
  const f = enc.flush(); if (f.length) out.push(f);
  return new Blob(out, { type: 'audio/mpeg' });
}
async function finishExport(blob, fmt) {
  try {
    if (fmt === 'mp4' && blob.type.includes('mp4')) return saveFile(blob, nameFor('mp4'));
    if (fmt === 'mp4') kitMsg('This browser cannot record MP4, so the mix was saved as WebM');
    if (fmt === 'mp4' && !blob.type.includes('mp4')) return saveFile(blob, nameFor('webm'));
    const buf = await ctx.decodeAudioData(await blob.arrayBuffer());
    if (fmt === 'wav') return saveFile(new Blob([encodeWavStereo(buf)], { type: 'audio/wav' }), nameFor('wav'));
    if (fmt === 'mp3') { await loadLame(); return saveFile(encodeMp3(buf), nameFor('mp3')); }
  } catch (err) { kitMsg('Export failed: ' + err.message); }
}

// Sliders get a typeable number box beside them (works for sliders added later too)
function addNumBox(r) {
  if (r.dataset.nb) return;
  r.dataset.nb = '1';
  const pct = +r.min === 0 && +r.max === 1 && +r.step < 0.1;
  const n = document.createElement('input');
  n.type = 'number'; n.className = 'numbox';
  n.min = pct ? 0 : r.min; n.max = pct ? 100 : r.max; n.step = pct ? 1 : r.step;
  const show = () => { n.value = pct ? Math.round(r.value * 100) : r.value; };
  show();
  n.setAttribute('aria-label', (r.getAttribute('aria-label') || r.title || 'value') + (pct ? ' percent' : ' value'));
  const unit = document.createElement('span');
  unit.className = 'numunit'; unit.textContent = pct ? '%' : '';
  r.after(n); n.after(unit);
  r.addEventListener('input', show);
  n.addEventListener('change', () => {
    const raw = +n.value || 0;
    r.value = pct ? Math.min(100, Math.max(0, raw)) / 100 : Math.min(+r.max, Math.max(+r.min, raw));
    show();
    r.dispatchEvent(new Event('input', { bubbles: true }));
  });
}
new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(nd => {

  if (nd.querySelectorAll) nd.querySelectorAll('input[type=range]').forEach(addNumBox);

document.querySelectorAll('input[type=range]').forEach(addNumBox);

// ---------- Presets (built-in and shared) ----------

function cleanFx(list) {

    const p = { ...FX_DEFS[f.type].p };
    Object.keys(p).forEach(k => { const v = +((f.p || {})[k]); if (Number.isFinite(v)) p[k] = v; });
